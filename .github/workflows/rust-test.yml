name: "Test"

on:
  workflow_call:
    inputs:
      postgres:
        default: false
        required: false
        type: boolean
      postgres-image:
        default: "postgres:17.5-alpine"
        required: false
        type: string
      mysql:
        default: false
        required: false
        type: boolean
      mysql-image:
        default: "mysql:8.0-debian"
        required: false
        type: string
      cockroach:
        default: false
        required: false
        type: boolean
      cockroach-version:
        default: "v24.3.18"
        required: false
        type: string
      cockroach-user:
        default: "timada"
        required: false
        type: string
      protoc:
        default: false
        required: false
        type: boolean
      tests:
        default: '["cargo test --workspace"]'
        required: false
        type: string

env:
  RUST_BACKTRACE: 1
  # Keep cached target dirs small: no incremental dirs, and just enough
  # debug info for file/line numbers in backtraces.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: arduino/setup-protoc@v2
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) }}

      - run: cargo clippy --all-features -- -D warnings

  machete:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Protoc
        if: ${{ inputs.protoc }}
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # `cargo machete --with-metadata` only reads manifests + the registry,
      # so there is no target dir worth keeping here.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          save-if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) }}

      - run: cargo machete --with-metadata

  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        cmd: ${{ fromJSON(inputs.tests) }}

    env:
      # One cache for the whole matrix, saved by the first entry only, so the
      # matrix does not race to upload the same key.
      SAVE_CACHE: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) && matrix.cmd == fromJSON(inputs.tests)[0] }}

    services:
      postgres:
        image: ${{ inputs.postgres && inputs.postgres-image || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      mysql:
        image: ${{ inputs.mysql && inputs.mysql-image || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 3306:3306

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v2
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      # A red test run still produces valid dependency artifacts; saving them
      # keeps pull requests from rebuilding deps until main is green again.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE }}

      - name: Start a single CockroachDB instance with docker
        if: ${{ inputs.cockroach }}
        run: |
          docker pull cockroachdb/cockroach:${{ inputs.cockroach-version }}
          docker run -d --name roach --hostname roach -p 26257:26257 -p 8080:8080 cockroachdb/cockroach:${{ inputs.cockroach-version }} start-single-node --insecure
          sudo apt update && sudo apt install wait-for-it -y
          wait-for-it -h localhost -p 26257
          docker exec roach bash -c "echo 'CREATE USER IF NOT EXISTS ${{ inputs.cockroach-user }}; GRANT admin TO ${{ inputs.cockroach-user }};' | cockroach sql --insecure"

      - run: ${{ matrix.cmd }}

      # Each matrix entry resolves dependency features for its own package
      # set (`cargo test -p <crate>`), so the entries need different
      # dependency artifacts. A cache holding only the first entry's build
      # leaves the others recompiling hundreds of crates on every run.
      # Before the first entry saves, build every other entry's dependencies
      # too, with a runner that skips executing the test binaries, so the
      # single cache holds the union of all variants. Failures here are only
      # warnings: the real test results come from the matrix entries.
      - name: Warm the cache with the other matrix entries
        if: ${{ env.SAVE_CACHE == 'true' }}
        env:
          TESTS: ${{ inputs.tests }}
          CURRENT: ${{ matrix.cmd }}
        run: |
          export "CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr 'a-z-' 'A-Z_')_RUNNER=true"
          jq -r '.[]' <<< "$TESTS" | while read -r cmd; do
            [ "$cmd" = "$CURRENT" ] && continue
            echo "::group::$cmd"
            bash -ec "$cmd" || echo "::warning::Cache warm-up failed for: $cmd"
            echo "::endgroup::"
          done

  # A cache key ends in a hash of Cargo.lock, since a cache is never written
  # twice under one key: every change to the dependencies saves another one,
  # and the ones before it stay until GitHub evicts them, a week later or
  # when the repository is full. Once the jobs above saved theirs, keep the
  # one each of them last used on this branch and delete the rest.
  prune-caches:
    needs: [clippy, machete, test]
    if: ${{ always() && contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) }}
    runs-on: ubuntu-24.04
    # Never what makes a run red.
    continue-on-error: true

    permissions:
      actions: write

    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          # A key is `v0-rust-<job>-<os>-<arch>-<toolchain>-<lock>`: the
          # caches of one job are those that share everything before the
          # last two parts.
          gh api --paginate "repos/$REPO/actions/caches?ref=$REF&key=v0-rust-&per_page=100" \
            --jq '.actions_caches[] | [.last_accessed_at, .id, .key] | @tsv' \
            | sort -r \
            | while IFS=$'\t' read -r _ id key; do
                job="${key%-*-*}"
                case "${kept-}" in
                  *"|$job|"*)
                    echo "deleting $key"
                    gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null \
                      || echo "::warning::could not delete the cache $key"
                    ;;
                  *)
                    echo "keeping $key"
                    kept="${kept-}|$job|"
                    ;;
                esac
              done
