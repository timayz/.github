name: "Test"

on:
  workflow_call:
    inputs:
      postgres:
        default: false
        required: false
        type: boolean
      postgres-image:
        default: "postgres:17.5-alpine"
        required: false
        type: string
      mysql:
        default: false
        required: false
        type: boolean
      mysql-image:
        default: "mysql:8.0-debian"
        required: false
        type: string
      cockroach:
        default: false
        required: false
        type: boolean
      cockroach-version:
        default: "v24.3.18"
        required: false
        type: string
      cockroach-user:
        default: "timada"
        required: false
        type: string
      protoc:
        default: false
        required: false
        type: boolean
      tests:
        default: '["cargo test --workspace"]'
        required: false
        type: string

env:
  RUST_BACKTRACE: 1
  # Keep cached target dirs small: no incremental dirs, and just enough
  # debug info for file/line numbers in backtraces.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: arduino/setup-protoc@v2
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) }}

      - run: cargo clippy --all-features -- -D warnings

  machete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Protoc
        if: ${{ inputs.protoc }}
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # `cargo machete --with-metadata` only reads manifests + the registry,
      # so there is no target dir worth keeping here.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          save-if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) }}

      - run: cargo machete --with-metadata

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cmd: ${{ fromJSON(inputs.tests) }}

    services:
      postgres:
        image: ${{ inputs.postgres && inputs.postgres-image || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      mysql:
        image: ${{ inputs.mysql && inputs.mysql-image || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 3306:3306

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v2
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      # One cache for the whole matrix instead of one per test command.
      # Only the first entry saves it, so the matrix does not race to upload
      # the same key and the cached artifacts stay deterministic.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-bin: false
          save-if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rn"]'), github.ref) && matrix.cmd == fromJSON(inputs.tests)[0] }}

      - name: Start a single CockroachDB instance with docker
        if: ${{ inputs.cockroach }}
        run: |
          docker pull cockroachdb/cockroach:${{ inputs.cockroach-version }}
          docker run -d --name roach --hostname roach -p 26257:26257 -p 8080:8080 cockroachdb/cockroach:${{ inputs.cockroach-version }} start-single-node --insecure
          sudo apt update && sudo apt install wait-for-it -y
          wait-for-it -h localhost -p 26257
          docker exec roach bash -c "echo 'CREATE USER IF NOT EXISTS ${{ inputs.cockroach-user }}; GRANT admin TO ${{ inputs.cockroach-user }};' | cockroach sql --insecure"

      - run: ${{ matrix.cmd }}
